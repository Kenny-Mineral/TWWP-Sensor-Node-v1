      # ─── Dynamic K-table guidance (all channels) ──────────────
      - type: grid
        column_span: 2
        title: Dynamic K-table (Multi-Point Flow Calibration)
        cards:
          - type: markdown
            content: >
              **What it does:** Instead of one fixed K value, the firmware interpolates K from a table of
              `(flow_lpm, K)` points, improving accuracy across the sensor's full flow range.
              Updated every second from the smoothed flow rate.

              **When to update:** After field calibration data shows consistent K errors across flow rates.
              Use `push_ktable.py` (see `scripts/`) to auto-format data from the Excel workbook.

              **Format:** JSON array, ordered low-to-high by `flow_lpm`.
              Example: `[{"flow_lpm":0.5,"k":660},{"flow_lpm":1.0,"k":780},{"flow_lpm":2.0,"k":840}]`

              **Manual paste:** Edit the K Table text entity below and save.
