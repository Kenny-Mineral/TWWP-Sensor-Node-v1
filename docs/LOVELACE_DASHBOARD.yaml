      # ─── Tank Configuration & Calibration ─────────────────────
      - type: grid
        column_span: 1
        title: Tank Volume Calibration
        cards:
          - type: markdown
            content: >
              **Purpose:** Calibrate the software tank volume so the level readout is accurate.

              **When to run:** After any tank-empty event, or if level drifts significantly from expected.

              **Procedure:**
              1. Let the tanks run dry (open tap until flow stops)
              2. Press **Reset to Empty** — firmware resets level to 0 L
              3. Let the RO system fill the tanks (2–3 hrs, possibly longer at low supply pressure)
              4. When Ch3 flow stops (tanks full), firmware auto-snaps level to capacity
              5. Check the auto-detected capacity vs expected (~19 L) and adjust if needed

              **Note:** If the auto-detected capacity looks wrong, adjust _Tank Capacity_ manually.
          - type: tile
            entity: sensor.twwp_wh_001_tank_level
            name: Tank Level (L)
            icon: mdi:water-tank
            grid_options:
              columns: 6
              rows: auto
