  ##############################################################
  # VIEW 3 — SESSIONS
  ##############################################################
  - type: sections
    title: Sessions
    icon: mdi:history
    max_columns: 4
    sections:

      # Sessions table
      - type: grid
        column_span: 3
        title: Last 10 Sessions
        cards:
          - type: custom:flex-table-card
            title: Tap Sessions
            entities:
              include: sensor.twwp_wh_001_recent_sessions
            columns:
              - name: Date
                attr_as_list: sessions
                modify: >
                  new Date(x.start_ts * 1000).toLocaleDateString('en-AU',
                    {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})
              - name: Session
                modify: >
                  x.dur_s >= 60
                    ? Math.floor(x.dur_s/60) + 'm ' + (x.dur_s % 60) + 's'
                    : x.dur_s + 's'
              - name: Flow
                modify: >
                  x.flow_dur_s >= 60
                    ? Math.floor(x.flow_dur_s/60) + 'm ' + (x.flow_dur_s % 60) + 's'
                    : x.flow_dur_s + 's'
              - name: Idle
                modify: >
                  (x.idle_s || 0) > 0
                    ? ((x.idle_s >= 60)
                        ? Math.floor(x.idle_s/60) + 'm ' + (x.idle_s % 60) + 's'
                        : x.idle_s + 's')
                    : '—'
              - name: Out (L)
                modify: parseFloat(x.vol_out).toFixed(3)
              - name: In (L)
                modify: parseFloat(x.vol_in).toFixed(3)
              - name: Peak Out
                modify: parseFloat(x.peak_out).toFixed(2) + ' L/m'
              - name: Peak In
                modify: parseFloat(x.peak_in).toFixed(2) + ' L/m'
            css:
              table: "font-size: 0.85em;"

      # Last session + settings
      - type: grid
        column_span: 1
        title: Last Session & Settings
        cards:
          - type: heading
            heading: Last Session
            heading_style: subtitle
          - type: tile
            entity: sensor.twwp_wh_001_last_session_id
            name: Session ID
            grid_options:
              columns: full
              rows: auto
          - type: tile
            entity: sensor.twwp_wh_001_last_session_duration
            name: Duration (s)
            grid_options:
              columns: full
              rows: auto
          - type: tile
            entity: sensor.twwp_wh_001_last_session_flow_time
            name: Flow Time (s)
            grid_options:
              columns: full
              rows: auto
          - type: tile
            entity: sensor.twwp_wh_001_last_session_idle_time
            name: Idle Time (s)
            grid_options:
              columns: full
              rows: auto
          - type: tile
            entity: sensor.twwp_wh_001_last_session_volume_out
            name: Volume Out (L)
            grid_options:
              columns: full
              rows: auto
          - type: tile
            entity: sensor.twwp_wh_001_last_session_volume_in
            name: Volume In (L)
            grid_options:
              columns: full
              rows: auto
          - type: heading
            heading: Session Settings
            heading_style: subtitle
          - type: tile
            entity: switch.twwp_wh_001_session_tracking
            name: Session Tracking
            grid_options:
              columns: full
              rows: auto
          - type: tile
            entity: number.twwp_wh_001_session_idle_timeout
            name: Idle Timeout (s)
            grid_options:
              columns: full
              rows: auto
          - type: tile
            entity: number.twwp_wh_001_flow_detection_threshold
            name: Flow Threshold (L/min)
            grid_options:
              columns: full
              rows: auto

