    icon: mdi:tune-variant
    max_columns: 2
    sections:

      # ─── WQ Probe calibration (physical) ─────────────────────
      - type: grid
        column_span: 2
        title: Water Quality Probes — Physical Calibration
        cards:
          - type: markdown
            content: >
              ## How to calibrate YiErYi probes


              The probe module performs calibration itself — Home Assistant only records the date.


              **What you need:**
              buffer solutions for pH (4.0, 7.0), ORP (225 mV), and conductivity (1413 µS/cm)


