
; TWWP Node firmware
; Board: Waveshare ESP32-S3-RS485-CAN
; Module: ESP32-S3-WROOM-1 — 16MB flash, 8MB OPI PSRAM
; Last updated: 2026-04-19
;
; Board notes from Waveshare demo code:
;   - Onboard PCF85063 RTC on internal I2C: GPIO38(SDA) / GPIO39(SCL) — not used by TWWP firmware
;   - RS485 uses UART_MODE_RS485_HALF_DUPLEX — hardware auto-handles DE/RE via GPIO21
;   - GPIO47 reserved onboard (CH1 control)
;   - All FreeRTOS tasks should be pinned to core 0 (matches Waveshare pattern)
;   - PSRAM buffer allocation: heap_caps_malloc(..., MALLOC_CAP_SPIRAM)

[platformio]
default_envs = waveshare-esp32-s3-rs485-can

[env:waveshare-esp32-s3-rs485-can]
platform  = espressif32 @ 6.9.0
board     = esp32-s3-devkitc-1        ; No dedicated PlatformIO def for this board — devkitc-1 is the correct base
framework = arduino

; ── Correct hardware specs for the actual Waveshare module ────────────────────
; ESP32-S3-WROOM-1-N16R8: 16MB QIO flash + 8MB OPI PSRAM
; board_build.arduino.memory_type selects flash+PSRAM mode for the Arduino HAL.
; qio_opi = QIO flash (standard) + OPI PSRAM (octal, what the N16R8 module uses).
board_build.flash_size              = 16MB
board_build.flash_mode              = qio
board_build.arduino.memory_type     = qio_opi
board_upload.flash_size             = 16MB

; ── USB CDC — this board uses USB-C direct (no UART-to-USB chip) ──────────────
; Without these, Serial output is silent.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DMQTT_MAX_PACKET_SIZE=4096
  -DNODE_FIRMWARE_VERSION='"0.1.0"'
  -DCONFIG_MBEDTLS_DYNAMIC_BUFFER=1
  -std=gnu++11

; ── Partition scheme — OTA-ready, uses all 16MB ───────────────────────────────
board_build.partitions = default_16MB.csv

; ── Upload / monitor ──────────────────────────────────────────────────────────
monitor_speed = 115200
upload_speed  = 921600
; To upload: hold BOOT, tap RESET, release BOOT — board enters download mode.
; Then run pio run -t upload immediately.
; DTR maps to GPIO0 (BOOT) on ESP32-S3 USB-JTAG — keep both lines deasserted
; so the chip boots from flash instead of entering download mode when the
; monitor opens the port.
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<*>

; ── Libraries ─────────────────────────────────────────────────────────────────
; Versions pinned to match Waveshare demo bundle where applicable.
lib_deps =
  tzapu/WiFiManager @ ^2.0.17

  ; Waveshare bundles PubSubClient 2.8 — pin to this
  knolleary/PubSubClient @ 2.8

  ; Waveshare bundles ArduinoJson 7.2.1 — v7 has breaking changes from v6, use v7
  bblanchon/ArduinoJson @ ^7.2.1

  ; Waveshare bundles NTPClient 3.2.1
  arduino-libraries/NTPClient @ 3.2.1

  adafruit/RTClib @ ^2.1.4
  adafruit/Adafruit BusIO @ ^1.14.5
  SPI
  Wire
  greiman/SdFat @ ^2.2.3
  paulstoffregen/OneWire @ ^2.3.7
  milesburton/DallasTemperature @ ^3.11.0
  fastled/FastLED @ ^3.6.0

  ; M2.5 — ADS1115 16-bit I2C ADC for 12V battery voltage monitor
  adafruit/Adafruit ADS1X15 @ ^2.5.0

  ; OLED display — SSD1306 128×64 with sliding UI framework
  ThingPulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.4.0

  ; RS485/Modbus for YiErYi 3788 (M5) — uncomment when ready
  ; Note: physical RS485 layer uses UART_MODE_RS485_HALF_DUPLEX (no lib needed for DE/RE)
  ; This lib handles Modbus RTU protocol only
  ; emelianov/modbus-esp8266 @ ^4.1.0

; ── OTA (LAN) upload environment ──────────────────────────────────────────────
; Use this env to push firmware wirelessly over the LAN via ArduinoOTA.
; The node must be powered, connected to WiFi, and idle (not mid-OTA).
; Hostname = "twwp-" + NODE_ID — update upload_port if NODE_ID changes.
; Select "env:ota" in the PlatformIO toolbar before clicking Upload.
[env:ota]
extends           = env:waveshare-esp32-s3-rs485-can
upload_protocol   = espota
upload_port       = 192.168.20.18

; ── Native unit tests ─────────────────────────────────────────────────────────
; Desktop-runnable tests for pure-logic drivers (no hardware required).
; Run with: pio test -e native
; Stubs in test/stubs/ replace Arduino.h, HardwareSerial.h, driver/uart.h.
[env:native]
platform        = native
test_build_src  = no
build_flags     = -DUNIT_TEST -I test/stubs -I include -std=gnu++11
lib_deps        = bblanchon/ArduinoJson @ ^7.2.1
